<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Post Simulator · Simula cómo se verá tu publicación</title>
    <meta name="theme-color" content="#0a66c2" />
    <meta
      name="description"
      content="Simula cómo se verá tu publicación antes de subirla: texto, imágenes, vídeo, documentos y carruseles con estética de post profesional. Gratis, sin registro y funciona sin conexión."
    />
    <link rel="canonical" href="https://luckstudio.github.io/post-simulator/" />

    <!-- App instalable (PWA) e iconos -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="application-name" content="Post Simulator" />
    <meta name="apple-mobile-web-app-title" content="Post Simulator" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Telegram, LinkedIn, Slack, iMessage, X…).
         Las URL tienen que ser absolutas: si cambia la dirección de la web, cámbialas aquí. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Post Simulator" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://luckstudio.github.io/post-simulator/" />
    <meta property="og:title" content="Post Simulator · Simula tu publicación antes de subirla" />
    <meta
      property="og:description"
      content="Simula cómo se verá tu publicación antes de subirla: texto, imágenes, vídeo, documentos y carruseles con estética de post profesional. Gratis, sin registro y funciona sin conexión."
    />
    <meta property="og:image" content="https://luckstudio.github.io/post-simulator/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://luckstudio.github.io/post-simulator/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tres slides de un carrusel de ejemplo: portada, publicación con imagen y cierre."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Post Simulator · Simula tu publicación antes de subirla" />
    <meta
      name="twitter:description"
      content="Simula cómo se verá tu publicación antes de subirla: texto, imágenes, vídeo, documentos y carruseles con estética de post profesional. Gratis, sin registro y funciona sin conexión."
    />
    <meta name="twitter:image" content="https://luckstudio.github.io/post-simulator/og-image.jpg" />
    <script>
      // Aplica la apariencia guardada antes de pintar (evita un destello claro en modo oscuro).
      // Misma lógica que src/ui/appearance.js.
      try {
        var ui = JSON.parse(localStorage.getItem('carrusel-ofertas-prefs-v1') || '{}').ui || {};
        if (ui.appearance === 'light' || ui.appearance === 'dark')
          document.documentElement.dataset.theme = ui.appearance;
        if (ui.density === 'compact') document.documentElement.dataset.density = 'compact';
        if (ui.mobilePreview === 'floating') document.documentElement.dataset.preview = 'floating';
        if (ui.startScreen === 'editor') document.documentElement.dataset.start = 'editor';
      } catch (e) {}
      // Pantalla con la que se abre: la de inicio, salvo que se haya elegido seguir editando.
      document.documentElement.dataset.screen = document.documentElement.dataset.start === 'editor' ? 'editor' : 'home';
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Pantalla de inicio: proyectos guardados (se rellena desde src/ui/home.js) -->
    <section class="home" id="home" aria-label="Inicio" hidden></section>

    <div class="app">
      <nav class="rail" aria-label="Secciones">
        <div class="rail-brand" title="Post Simulator">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="40" height="40" aria-hidden="true">
            <defs>
              <linearGradient id="marcaFondo" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2386e6" />
                <stop offset="1" stop-color="#0a4f9e" />
              </linearGradient>
              <filter id="marcaSombra" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04264d" flood-opacity=".35" />
              </filter>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#marcaFondo)" />
            <g transform="translate(256 256) scale(1) translate(-256 -256)">
              <rect x="66" y="152" width="124" height="196" rx="24" fill="#fff" opacity=".32" />
              <rect x="322" y="152" width="124" height="196" rx="24" fill="#fff" opacity=".32" />
              <g filter="url(#marcaSombra)">
                <rect x="144" y="112" width="224" height="276" rx="30" fill="#fff" />
              </g>
              <circle cx="200" cy="176" r="30" fill="#0a66c2" />
              <rect x="176" y="236" width="160" height="26" rx="13" fill="#1f2a37" opacity=".85" />
              <rect x="176" y="284" width="110" height="26" rx="13" fill="#0a66c2" />
              <circle cx="226" cy="430" r="9" fill="#fff" opacity=".5" />
              <circle cx="256" cy="430" r="9" fill="#fff" />
              <circle cx="286" cy="430" r="9" fill="#fff" opacity=".5" />
            </g>
          </svg>
        </div>
        <div class="rail-tabs" id="tabs"></div>
      </nav>

      <aside class="panel" aria-label="Ajustes de la sección">
        <header class="panel-head">
          <h2 id="panelTitle">Post</h2>
        </header>
        <div class="panel-body" id="panel"></div>
      </aside>

      <main class="main" aria-label="Vista previa">
        <h1 class="sr">Post Simulator</h1>
        <div class="toolbar">
          <button
            class="btn icon"
            id="homeGo"
            type="button"
            aria-label="Inicio: tus proyectos"
            title="Inicio"
            data-icon="home"
            data-icon-size="20"
          ></button>
          <div class="seg" id="fmtTop" role="group" aria-label="Proporción"></div>
          <div class="seg" id="modeSeg" role="group" aria-label="Modo de vista">
            <button type="button" data-mode="static" aria-pressed="true">Estático</button>
            <button type="button" data-mode="anim" aria-pressed="false">Animado</button>
          </div>
          <button class="btn" id="playBtn" type="button" hidden>Pausar</button>
          <button class="btn" id="replayBtn" type="button" hidden>Repetir</button>
          <label class="btn" id="allWrap" hidden><input type="checkbox" id="playAll" /> Todo el carrusel</label>
          <div class="spacer"></div>
          <button
            class="btn icon only-narrow"
            id="settingsGo"
            type="button"
            aria-label="Configuración"
            data-icon="settings"
            data-icon-size="20"
          ></button>
          <button class="btn primary" id="exportGo" type="button">Exportar</button>
        </div>

        <div class="canvas-wrap" id="cwrap">
          <canvas id="preview" width="1080" height="1350" aria-label="Vista previa de la slide"></canvas>
        </div>

        <div class="dock">
          <div class="nav-row">
            <button
              class="btn icon"
              id="prevBtn"
              type="button"
              aria-label="Slide anterior"
              data-icon="prev"
              data-icon-size="20"
            ></button>
            <span class="count" id="count" aria-live="polite">—</span>
            <button
              class="btn icon"
              id="slideMenuBtn"
              type="button"
              aria-label="Más acciones de esta slide"
              aria-haspopup="menu"
              data-icon="more"
              data-icon-size="20"
            ></button>
            <button
              class="btn icon"
              id="nextBtn"
              type="button"
              aria-label="Slide siguiente"
              data-icon="next"
              data-icon-size="20"
            ></button>
          </div>
          <div class="dots" id="dots" role="group" aria-label="Slides"></div>
          <div class="film" id="film" aria-label="Slides del carrusel"></div>
        </div>
      </main>
    </div>

    <!-- Vista completa (solo móvil): la misma vista previa a pantalla completa -->
    <div class="fullview" id="fullview" role="dialog" aria-modal="true" aria-label="Vista completa" hidden>
      <header class="fullbar">
        <button
          class="btn icon dark"
          id="fullClose"
          type="button"
          aria-label="Cerrar la vista completa"
          data-icon="close"
          data-icon-size="20"
        ></button>
        <strong id="fullTitle" aria-live="polite"></strong>
        <button
          class="btn icon dark"
          id="fullPlay"
          type="button"
          aria-label="Reproducir la animación"
          data-icon="play"
          data-icon-size="18"
        ></button>
      </header>
      <div class="full-stage" id="fullStage"></div>
      <footer class="fullfoot">
        <div class="dots" role="group" aria-label="Slides"></div>
        <p class="fullhint">Desliza para cambiar de slide · mantén pulsado para más opciones</p>
        <div class="fullrow">
          <button class="btn dark" id="fullEdit" type="button">Editar esta slide</button>
          <button class="btn primary" id="fullExport" type="button">Exportar</button>
        </div>
      </footer>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <div class="modal" id="recModal" role="dialog" aria-modal="true" aria-labelledby="recTitle">
      <div class="box">
        <h4 id="recTitle">Grabando vídeo</h4>
        <p id="recText">Mantén esta pestaña visible hasta que termine.</p>
        <div class="bar"><i id="recBar"></i></div>
        <button class="btn" id="recCancel" type="button">Cancelar</button>
      </div>
    </div>
    <input type="file" id="importInput" accept=".json,.html,application/json,text/html" class="sr" tabindex="-1" />
    <script type="module" src="/main.js"></script>
  </body>
</html>
