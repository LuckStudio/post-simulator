<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio de carruseles de ofertas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#E8EAED; --panel:#FFFFFF; --panel-2:#F5F6F8; --ink:#22262B; --muted:#5D6570; --line:#D6DADF;
  --accent:#0E6B58; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA; --stage:#2C3238; --stage-ink:#C9D0D7;
  --danger:#B42318; --focus:#0E6B58;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16191C; --panel:#1E2226; --panel-2:#262B30; --ink:#E7EAED; --muted:#9AA3AD; --line:#353B42;
    --accent:#4FC2A6; --accent-ink:#0F1A17; --accent-soft:#1F3A33; --stage:#0F1215; --stage-ink:#9AA3AD;
    --danger:#F97066; --focus:#4FC2A6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16191C; --panel:#1E2226; --panel-2:#262B30; --ink:#E7EAED; --muted:#9AA3AD; --line:#353B42;
  --accent:#4FC2A6; --accent-ink:#0F1A17; --accent-soft:#1F3A33; --stage:#0F1215; --stage-ink:#9AA3AD;
  --danger:#F97066; --focus:#4FC2A6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto 1fr;min-height:0}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand strong{font-size:17px;font-weight:700;letter-spacing:-0.01em}
.brand span{font-size:13px;color:var(--muted)}
.top .spacer{flex:1}
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:0 2px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 9px 10px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;position:relative}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}
.panel-body{flex:1;overflow-y:auto;padding:4px 20px 40px}
.group{padding:18px 0;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group h3{margin:0 0 12px;font-size:15px;font-weight:700}
.group p.hint{margin:-4px 0 12px;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=number],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:14px}
textarea{resize:vertical;line-height:1.45}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer}
.color-row{display:flex;align-items:center;gap:10px}
.color-row input[type=text]{flex:1}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1 1 auto;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;font-size:14px;cursor:pointer}
.toggle input{appearance:none;width:38px;height:22px;border-radius:22px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(16px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:14px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-col{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.thumbs-edit{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.thumbs-edit figure{margin:0;position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.thumbs-edit img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs-edit .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:rgba(0,0,0,.55)}
.thumbs-edit .ctl button{border:0;background:none;color:#fff;font-size:12px;padding:3px 6px;cursor:pointer}
.el-row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.el-row .name{font-size:13px;font-weight:600}
.el-row .ctrls{display:grid;grid-template-columns:1fr 92px;gap:6px}
.el-row select{padding:7px 8px;font-size:13px}
.el-row input[type=range]{width:100%;accent-color:var(--accent)}
.el-row .dur{display:flex;flex-direction:column;font-size:11px;color:var(--muted);text-align:right}
.stage{background:var(--stage);display:flex;flex-direction:column;min-height:0;min-width:0}
.stage-bar{display:flex;align-items:center;gap:10px;padding:12px 18px;color:var(--stage-ink);flex-wrap:wrap}
.stage-bar .seg{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.stage-bar .seg button{color:var(--stage-ink)}
.stage-bar .seg button[aria-pressed="true"]{background:rgba(255,255,255,.92);color:#1B1F23}
.stage-bar .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#EEF1F4}
.stage-bar .btn:hover{border-color:rgba(255,255,255,.4)}
.stage-bar .count{font-variant-numeric:tabular-nums;font-size:14px;min-width:120px;text-align:center}
.stage-bar .spacer{flex:1}
.canvas-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 18px}
#preview{display:block;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.45);background:#fff}
.film{display:flex;gap:10px;padding:12px 18px 16px;overflow-x:auto}
.film button{flex:none;border:2px solid transparent;background:none;padding:0;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--stage-ink);font-size:12px;font-weight:600}
.film button canvas{display:block;border-radius:4px;height:96px;width:auto}
.film button[aria-current="true"]{color:#fff}
.film button[aria-current="true"] canvas{outline:2px solid #fff;outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1F2328;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:#7A1A12}
.modal{position:fixed;inset:0;background:rgba(10,12,14,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border-radius:14px;padding:24px;width:min(420px,100%);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h4{margin:0 0 6px;font-size:17px}
.modal p{margin:0 0 16px;color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:8px;background:var(--panel-2);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
.note{font-size:13px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto;min-height:100%}
  .stage{order:2}
  .panel{order:3;border-right:0}
  .panel-body{overflow:visible}
  .canvas-wrap{height:62vh}
  .top .seg{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><strong>Estudio de carruseles</strong><span>Ofertas de empleo con estética de post profesional</span></div>
    <div class="spacer"></div>
    <div class="seg" id="fmtTop" role="group" aria-label="Proporción"></div>
  </header>
  <aside class="panel">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
    <div class="panel-body" id="panel"></div>
  </aside>
  <section class="stage" aria-label="Vista previa">
    <div class="stage-bar">
      <div class="seg" id="modeSeg" role="group" aria-label="Modo de vista">
        <button type="button" data-mode="static" aria-pressed="true">Estático</button>
        <button type="button" data-mode="anim" aria-pressed="false">Animado</button>
      </div>
      <button class="btn" id="playBtn" type="button" hidden>Pausar</button>
      <button class="btn" id="replayBtn" type="button" hidden>Repetir</button>
      <label class="btn" id="allWrap" hidden><input type="checkbox" id="playAll" style="accent-color:#fff"> Todo el carrusel</label>
      <div class="spacer"></div>
      <button class="btn" id="prevBtn" type="button" aria-label="Slide anterior">‹</button>
      <span class="count" id="count" aria-live="polite">—</span>
      <button class="btn" id="nextBtn" type="button" aria-label="Slide siguiente">›</button>
    </div>
    <div class="canvas-wrap" id="cwrap"><canvas id="preview" width="1080" height="1350" aria-label="Vista previa de la slide"></canvas></div>
    <div class="film" id="film" aria-label="Slides del carrusel"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="recModal" role="dialog" aria-modal="true" aria-labelledby="recTitle">
  <div class="box">
    <h4 id="recTitle">Grabando vídeo</h4>
    <p id="recText">Mantén esta pestaña visible hasta que termine.</p>
    <div class="bar"><i id="recBar"></i></div>
    <button class="btn" id="recCancel" type="button">Cancelar</button>
  </div>
</div>
<input type="file" id="importInput" accept=".json,.html,application/json,text/html" class="sr" tabindex="-1">
<script>
'use strict';
/* ---------- Básicos ---------- */
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const EASE={
  linear:t=>t,
  outCubic:t=>1-Math.pow(1-t,3),
  outQuint:t=>1-Math.pow(1-t,5),
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  inOutSine:t=>-(Math.cos(Math.PI*t)-1)/2,
  outBack:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}
};
const EASE_LABELS={outCubic:'Suave',outQuint:'Muy suave',outExpo:'Rápida al inicio',inOutSine:'Cinematográfica',outBack:'Con rebote',linear:'Lineal'};
const FORMATS={'4:5':[1080,1350],'1:1':[1080,1080],'3:4':[1080,1440],'9:16':[1080,1920],'16:9':[1920,1080]};
const FONTS={
  system:'-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
  inter:'Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif',
  source:'"Source Sans 3", -apple-system, "Segoe UI", Roboto, Arial, sans-serif'
};
const THEMES={
  light:{bg:'#F4F2EE',card:'#FFFFFF',text:'rgba(0,0,0,0.9)',muted:'rgba(0,0,0,0.6)',line:'rgba(0,0,0,0.12)',doc:'#ECEAE6'},
  dark:{bg:'#000000',card:'#1B1F23',text:'rgba(255,255,255,0.9)',muted:'rgba(255,255,255,0.62)',line:'rgba(255,255,255,0.16)',doc:'#2A2F35'}
};
const REACTIONS={like:{c:'#3D7FE0',l:'Me gusta'},love:{c:'#E5534B',l:'Corazón'},star:{c:'#1F9D63',l:'Estrella'},idea:{c:'#E8A531',l:'Idea'},smile:{c:'#13A8B8',l:'Sonrisa'}};
const ANIM_TYPES={
  'none':'Sin animación','fade':'Fundido','slide-up':'Subir','slide-down':'Bajar','slide-left':'Desde la derecha','slide-right':'Desde la izquierda',
  'zoom-in':'Acercar','zoom-out':'Alejar','pop':'Rebote','blur':'Desenfoque','wipe':'Barrido','flip':'Giro',
  'typewriter':'Máquina de escribir','words':'Palabra a palabra','lines':'Línea a línea','count-up':'Contador'
};
const TEXTUAL=new Set(['text','role','company','meta','ctaTitle','ctaText']);
const EL_GROUPS=[
  ['Publicación',[['card','Tarjeta'],['header','Cabecera'],['text','Texto'],['media','Multimedia'],['stats','Reacciones'],['actions','Botones']]],
  ['Portada',[['coverImage','Imagen'],['kicker','Etiqueta'],['role','Puesto'],['company','Empresa'],['meta','Detalles'],['coverFooter','Pie']]],
  ['Cierre',[['ctaIcon','Icono'],['ctaTitle','Título'],['ctaText','Texto'],['ctaButton','Botón']]]
];
function preset(map){const o={};for(const k in map)o[k]={type:map[k][0],dur:map[k][1]};return o;}
const PRESETS={
  suave:{label:'Suave',order:'cascada',stagger:0.16,ease:'outCubic',el:preset({card:['slide-up',.7],header:['fade',.5],text:['lines',1.4],media:['zoom-out',.9],stats:['count-up',1.2],actions:['fade',.5],coverImage:['fade',.9],kicker:['fade',.5],role:['slide-up',.7],company:['fade',.5],meta:['lines',.9],coverFooter:['fade',.5],ctaIcon:['pop',.6],ctaTitle:['slide-up',.6],ctaText:['fade',.6],ctaButton:['pop',.6]})},
  redaccion:{label:'Redacción',order:'secuencial',stagger:0.15,ease:'outCubic',el:preset({card:['fade',.5],header:['slide-right',.5],text:['typewriter',1],media:['wipe',.8],stats:['count-up',1],actions:['slide-up',.4],coverImage:['fade',.6],kicker:['fade',.4],role:['typewriter',1],company:['fade',.4],meta:['lines',.8],coverFooter:['fade',.4],ctaIcon:['pop',.5],ctaTitle:['typewriter',1],ctaText:['words',1],ctaButton:['pop',.5]})},
  dinamico:{label:'Dinámico',order:'cascada',stagger:0.1,ease:'outBack',el:preset({card:['pop',.6],header:['slide-left',.5],text:['words',1.2],media:['pop',.6],stats:['count-up',.9],actions:['slide-up',.4],coverImage:['zoom-out',.8],kicker:['pop',.5],role:['words',.8],company:['slide-up',.5],meta:['lines',.7],coverFooter:['slide-up',.5],ctaIcon:['pop',.5],ctaTitle:['zoom-in',.5],ctaText:['slide-up',.5],ctaButton:['pop',.5]})},
  cine:{label:'Cinematográfico',order:'cascada',stagger:0.28,ease:'inOutSine',el:preset({card:['blur',1],header:['blur',.8],text:['lines',1.8],media:['wipe',1.1],stats:['count-up',1.4],actions:['fade',.8],coverImage:['zoom-out',1.6],kicker:['blur',.8],role:['blur',1],company:['fade',.8],meta:['lines',1.2],coverFooter:['fade',.8],ctaIcon:['blur',.8],ctaTitle:['blur',.9],ctaText:['fade',.9],ctaButton:['flip',.8]})},
  ninguna:{label:'Sin animación',order:'cascada',stagger:0,ease:'linear',el:preset(Object.fromEntries(['card','header','text','media','stats','actions','coverImage','kicker','role','company','meta','coverFooter','ctaIcon','ctaTitle','ctaText','ctaButton'].map(k=>[k,['none',.5]])))}
};

const DEFAULT={
  v:1, format:'4:5',
  author:{name:'Estudio Norte',headline:'Estudio de diseño digital en Madrid',time:'2 h',globe:true,avatar:null,shape:'square',initials:'EN',avatarColor:'#2E5E4E',follow:true},
  post:{
    text:'¡Seguimos creciendo! 🚀\n\nBuscamos un/a Diseñador/a de Producto Senior que quiera liderar la experiencia de nuestras apps para clientes de retail y cultura.\n\nQué harás:\n→ Diseñar flujos completos, del research al prototipo.\n→ Trabajar codo con codo con desarrollo y negocio.\n→ Definir y mantener nuestro sistema de diseño.\n\nQué buscamos:\n→ 5 años o más diseñando producto digital.\n→ Dominio de Figma y prototipado.\n→ Ganas de explicar el porqué de cada decisión.\n\nOfrecemos modelo híbrido en Madrid, horario flexible y presupuesto anual de formación.\n\n¿Te interesa o conoces a alguien? Escríbenos o comparte este post 👇\n\n#empleo #diseño #UX #producto #Madrid',
    fit:'split', size:34, autoMin:24, autoMax:46, more:false, moreLines:5, repeatHeader:true, footerEvery:false, hashtags:true
  },
  media:{type:'none',aspect:'auto',items:[],zoom:1,fx:0.5,fy:0.5,docTitle:'Descripción del puesto',docPage:0,docAuto:true,videoTime:0,playIcon:true},
  stats:{show:true,reactions:128,comments:14,reposts:6,types:['like','love','star'],actions:true,labels:['Recomendar','Comentar','Compartir','Enviar']},
  cover:{on:true,layout:'card',image:null,overlay:0.55,kicker:'Estamos contratando',role:'Diseñador/a de Producto Senior',company:'Estudio Norte',location:'Madrid',modality:'Híbrido, 3 días en oficina',contract:'Jornada completa',salary:'45.000 – 55.000 € brutos/año',showAuthor:true,swipe:'Desliza para ver la oferta'},
  cta:{on:true,mode:'both',handle:'@estudionorte',seekTitle:'¿Buscas trabajo?',seekText:'Síguenos y te avisamos de cada nueva oferta que publiquemos.',seekBtn:'Seguir',offerTitle:'¿Tienes una vacante?',offerText:'Escríbenos y la compartimos con nuestra comunidad.',offerBtn:'Enviar mensaje'},
  style:{theme:'light',bgMode:'theme',bg:'#F4F2EE',bg2:'#DCE4EE',bgImage:null,bgDim:0.2,accent:'#0A66C2',font:'system',radius:16,shadow:true,margin:64,pager:true,footerHandle:true},
  anim:{preset:'suave',order:'cascada',stagger:0.16,hold:2.5,ease:'outCubic',cps:45,transition:'deslizar',fps:30,el:clone(PRESETS.suave.el)}
};

function deepMerge(base,over){
  if(Array.isArray(base)) return Array.isArray(over)?over:base;
  if(base&&typeof base==='object'){
    const out={...base};
    if(over&&typeof over==='object') for(const k of Object.keys(over)){ out[k]=(k in base)?deepMerge(base[k],over[k]):over[k]; }
    return out;
  }
  return over===undefined?base:over;
}
let state=clone(DEFAULT);
try{const saved=localStorage.getItem('carrusel-ofertas-v1'); if(saved) state=deepMerge(clone(DEFAULT),JSON.parse(saved));}catch(e){}

/* ---------- Runtime ---------- */
const R={S:1,imgs:new Map(),video:null,slides:[],cur:0,mode:'static',playing:false,playAll:false,t0:0,cancelRec:false};
function getImg(src){
  if(!src) return null;
  let e=R.imgs.get(src);
  if(!e){const im=new Image(); e={im,ok:false}; R.imgs.set(src,e); im.onload=()=>{e.ok=true;invalidate();}; im.onerror=()=>{}; im.src=src;}
  return e.ok?e.im:null;
}
function dims(){const f=FORMATS[state.format]||FORMATS['4:5'];return {W:f[0],H:f[1],S:Math.min(f[0],f[1])/1080};}
function th(){return THEMES[state.style.theme]||THEMES.light;}

function isAcc(t){return state.post.hashtags&&/^(#|@|https?:\/\/|www\.)/i.test(t);}

/* ---------- Animación genérica ---------- */
function withAnim(ctx,type,p,box,fn){
  ctx.save();const S=R.S;const e=(EASE[state.anim.ease]||EASE.outCubic)(p);const cx=box.x+box.w/2,cy=box.y+box.h/2;
  const fadeIn=v=>{ctx.globalAlpha*=clamp(v);};
  switch(type){
    case 'fade':fadeIn(EASE.outCubic(p));break;
    case 'slide-up':fadeIn(p*2.5);ctx.translate(0,(1-e)*80*S);break;
    case 'slide-down':fadeIn(p*2.5);ctx.translate(0,-(1-e)*80*S);break;
    case 'slide-left':fadeIn(p*2.5);ctx.translate((1-e)*140*S,0);break;
    case 'slide-right':fadeIn(p*2.5);ctx.translate(-(1-e)*140*S,0);break;
    case 'zoom-in':{fadeIn(p*2);const k=0.8+0.2*e;ctx.translate(cx,cy);ctx.scale(k,k);ctx.translate(-cx,-cy);break;}
    case 'zoom-out':{fadeIn(p*2);const k=1.2-0.2*e;ctx.translate(cx,cy);ctx.scale(k,k);ctx.translate(-cx,-cy);break;}
    case 'pop':{fadeIn(p*4);const k=0.5+0.5*EASE.outBack(p);ctx.translate(cx,cy);ctx.scale(k,k);ctx.translate(-cx,-cy);break;}
    case 'flip':{fadeIn(p*3);const k=Math.max(0.001,Math.abs(Math.cos((1-e)*Math.PI/2)));ctx.translate(cx,cy);ctx.scale(1,k);ctx.translate(-cx,-cy);break;}

    case 'wipe':ctx.beginPath();ctx.rect(box.x-4*S,box.y-80*S,(box.w+8*S)*e,box.h+160*S);ctx.clip();break;
    case 'count-up':fadeIn(p*4);break;

}

/* ---------- Construcción de slides ---------- */
function hasMedia(){const m=state.media;if(m.type==='none')return false;if(m.type==='video')return !!R.video;return m.items.length>0;}
function mediaNaturalH(cardW){
  const m=state.media;let ar=null;
  if(m.aspect!=='auto'){const [a,b]=m.aspect.split(':').map(Number);ar=a/b;}
  if(!ar){
    if(m.type==='image'){const im=getImg(m.items[0]);ar=im?srcSize(im)[0]/srcSize(im)[1]:1.2;}
    else if(m.type==='grid'){const n=m.items.length;ar=n<=1?1.2:n===2?1.5:1;}
    else if(m.type==='video'){const v=R.video;ar=v&&v.videoWidth?v.videoWidth/v.videoHeight:16/9;}
    else if(m.type==='document'){const im=getImg(m.items[0]);ar=im?srcSize(im)[0]/srcSize(im)[1]:0.77;}
  }
  ar=clamp(ar||1,0.5,2.6);let h=cardW/ar;if(m.type==='document')h+=76*R.S;return h;
}
function postGeometry(){
  const {W,H,S}=dims();const st=state.style;const M=st.margin*S;const footSpace=(st.pager||st.footerHandle)?56*S:0;
  const cardW=Math.min(W-2*M,1180*S);const cardX=(W-cardW)/2;const maxH=H-2*M-footSpace;const pad=40*S;
  const statsH=state.stats.show?72*S:0,actH=state.stats.actions?100*S:0;
  return {W,H,S,M,cardW,cardX,maxH,pad,innerW:cardW-2*pad,statsH,actH};
}
function stack(G,o){
  const S=G.S;let y=0;const pos={};
  if(o.header){y+=28*S;pos.header=y;y+=104*S;}
  if(o.nLines){y+=o.header?22*S:44*S;pos.text=y;y+=o.nLines*o.lh;y+=28*S;}else if(o.header)y+=24*S;
  if(o.mediaH){pos.media=y;y+=o.mediaH;}
  if(o.footer){if(G.statsH){pos.stats=y;y+=G.statsH;}if(G.actH){pos.actions=y;y+=G.actH;}}
  else if(!o.mediaH)y+=12*S;

}
function buildPostPages(G){

    for(let size=P.autoMax;size>=P.autoMin;size-=1){
      const lh=size*1.42;const lines=trimBlank(wrapText(P.text,G.innerW,size*S,400,true));
      if(stack(G,{header:1,nLines:lines.length,lh:lh*S,mediaH:mH,footer:1}).h<=G.maxH){chosen={size,lines};break;}
    }
    if(chosen){pages.push({header:true,lines:chosen.lines,size:chosen.size,mediaH:mH,footer:true,more:false});return pages;}
    return [singlePage(P.autoMin,mH,true)];
  }
  if(P.fit==='manual'){const mH=mi?Math.min(mi,G.maxH*0.55):0;return [singlePage(P.size,mH,false)];}
  // dividir
  const size=P.size,lh=size*1.42*S;const lines=trimBlank(wrapText(P.text,G.innerW,size*S,400,true));
  const tailMH=mi?Math.min(mi,G.maxH*0.55):0;let cur=null;
  const newPage=()=>{cur={header:pages.length===0||P.repeatHeader,lines:[],size,mediaH:0,footer:P.footerEvery,more:false};pages.push(cur);};
  const fits=(pg,add,tail)=>stack(G,{header:pg.header,nLines:pg.lines.length+add,lh,mediaH:tail?tailMH:0,footer:tail?true:pg.footer}).h<=G.maxH;
  for(const ln of lines){
    if(!cur)newPage();
    if(!cur.lines.length&&!ln.words.length)continue;
    if(fits(cur,1,false)){cur.lines.push(ln);continue;}
    let carry=[];
    for(let j=cur.lines.length-1;j>=Math.max(2,cur.lines.length-4);j--){if(!cur.lines[j].words.length){carry=cur.lines.splice(j);break;}}
    newPage();carry=trimBlank(carry);cur.lines.push(...carry);
    if(ln.words.length||cur.lines.length)cur.lines.push(ln);
  }
  if(!cur)newPage();
  if(fits(cur,0,true)){cur.mediaH=tailMH;cur.footer=true;}
  else{
    const prev=cur;newPage();cur.footer=true;
    if(mi){cur.mediaH=Math.min(mi,G.maxH-stack(G,{header:cur.header,nLines:0,lh,mediaH:0,footer:true}).h);}
    else{const move=[];while(move.length<3&&prev.lines.length>2){const l=prev.lines.pop();if(l.words.length)move.unshift(l);}cur.lines=trimBlank(move);}
  }

function postSlide(pg,G,i,n){

  if(pg.header){const b={x:G.cardX+G.pad,y:cy+pos.header,w:G.innerW,h:104*S};card.children.push({key:'header',box:b,draw:ctx=>drawHeader(ctx,b)});}

function buildSlides(){
  R.S=dims().S;const G=postGeometry();const out=[];
  if(state.cover.on)out.push(coverSlide(G));
  const pages=buildPostPages(G);pages.forEach((pg,i)=>out.push(postSlide(pg,G,i,pages.length)));
  if(state.cta.on)out.push(...ctaSlides(G));
  out.forEach((s,i)=>{s.index=i;timeline(s);});
  R.slides=out;if(R.cur>=out.length)R.cur=Math.max(0,out.length-1);
}
function cfgFor(key){const base=key.replace(/2$/,'');return state.anim.el[base]||{type:'fade',dur:0.6};}
function timeline(slide){
  const A=state.anim;const list=[];const walk=it=>{list.push(it);(it.children||[]).forEach(walk);};slide.items.forEach(walk);
  let prevStart=0,prevEnd=0,total=0;
  list.forEach((it,i)=>{
    const c=cfgFor(it.key);let type=c.type;const base=it.key.replace(/2$/,'');
    if(['typewriter','words','lines'].includes(type)&&!TEXTUAL.has(base))type='fade';
    if(type==='count-up'&&base!=='stats')type='fade';
    let dur=type==='none'?0.0001:Math.max(0.1,c.dur);
    if(type==='typewriter')dur=Math.max(0.4,(it.chars||30)/Math.max(5,A.cps));
    let start;if(i===0)start=0.15;else if(A.order==='secuencial')start=Math.max(prevStart,prevEnd-0.05);else start=prevStart+(i===1?Math.max(A.stagger,list[0]._dur*0.35):A.stagger);
    it._start=start;it._dur=dur;it._type=type;prevStart=start;prevEnd=start+dur;total=Math.max(total,start+dur);
  });
  slide.total=total+A.hold;
}
function drawSlide(ctx,slide,t){
  const {W,H}=dims();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);drawBg(ctx);
  const drawItem=it=>{
    const p=t==null?1:clamp((t-it._start)/it._dur);const type=t==null?'none':it._type;
    if(t!=null&&type!=='none'&&t<it._start)return;
    withAnim(ctx,type,p,it.box,()=>{
      if(it.key.startsWith('card')){drawCard(ctx,it.box);ctx.save();rr(ctx,it.box.x,it.box.y,it.box.w,it.box.h,state.style.radius*R.S);ctx.clip();(it.children||[]).forEach(drawItem);ctx.restore();}
      else it.draw(ctx,p,type,t==null?null:t-it._start);
    });
  };
  slide.items.forEach(drawItem);slideFooter(ctx,slide);ctx.restore();
}

const pv=$('#preview'),pctx=pv.getContext('2d');let renderQueued=false,thumbTimer=null;
function invalidate(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;buildSlides();fitCanvas();updateNav();if(R.mode==='static'||!R.playing)renderStatic();scheduleThumbs();});}
function renderStatic(){const sl=R.slides[R.cur];if(!sl)return;syncVideoStatic();drawSlide(pctx,sl,null);}
function fitCanvas(){const {W,H}=dims();if(pv.width!==W||pv.height!==H){pv.width=W;pv.height=H;}const wrap=$('#cwrap');const aw=wrap.clientWidth-36,ah=wrap.clientHeight-16;const sc=Math.max(0.05,Math.min(aw/W,ah/H));pv.style.width=Math.floor(W*sc)+'px';pv.style.height=Math.floor(H*sc)+'px';}
new ResizeObserver(()=>fitCanvas()).observe($('#cwrap'));
function updateNav(){const n=R.slides.length;const sl=R.slides[R.cur];$('#count').textContent=n?`${sl.label} · ${R.cur+1} de ${n}`:'—';$('#prevBtn').disabled=R.cur<=0;$('#nextBtn').disabled=R.cur>=n-1;
  document.querySelectorAll('#film button').forEach((b,i)=>b.setAttribute('aria-current',i===R.cur?'true':'false'));}
function go(i){R.cur=clamp(i,0,R.slides.length-1);updateNav();if(R.mode==='anim')restartPlay();else renderStatic();}
$('#prevBtn').onclick=()=>go(R.cur-1);$('#nextBtn').onclick=()=>go(R.cur+1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if(e.key==='ArrowLeft')go(R.cur-1);if(e.key==='ArrowRight')go(R.cur+1);});
function scheduleThumbs(){clearTimeout(thumbTimer);thumbTimer=setTimeout(renderThumbs,220);}
const thumbBuf=document.createElement('canvas');
function renderThumbs(){
  const film=$('#film');const {W,H}=dims();thumbBuf.width=W;thumbBuf.height=H;const bctx=thumbBuf.getContext('2d');
  while(film.children.length>R.slides.length)film.lastChild.remove();
  R.slides.forEach((sl,i)=>{
    let btn=film.children[i];
    if(!btn){btn=document.createElement('button');btn.type='button';btn.append(document.createElement('canvas'),document.createElement('span'));btn.onclick=()=>go(Number(btn.dataset.i));film.append(btn);}
    btn.dataset.i=i;btn.lastChild.textContent=sl.label;btn.setAttribute('aria-label',`Ir a ${sl.label}`);
    const c=btn.firstChild;const th_=96*2;const tw=Math.round(th_*W/H);c.width=tw;c.height=th_;c.style.height='96px';c.style.width=Math.round(96*W/H)+'px';
    drawSlide(bctx,sl,null);c.getContext('2d').drawImage(thumbBuf,0,0,tw,th_);
  });
  updateNav();
}
/* animación en vivo */
function setMode(m){R.mode=m;document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m?'true':'false'));
  const anim=m==='anim';$('#playBtn').hidden=!anim;$('#replayBtn').hidden=!anim;$('#allWrap').hidden=!anim;
  if(anim)restartPlay();else{R.playing=false;renderStatic();}}
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#playBtn').onclick=()=>{if(R.playing){R.playing=false;$('#playBtn').textContent='Reproducir';if(R.video)R.video.pause();}else{R.playing=true;$('#playBtn').textContent='Pausar';R.t0=performance.now()-(R.pausedAt||0)*1000;if(R.video&&slideHasVideo(R.slides[R.cur]))R.video.play().catch(()=>{});requestAnimationFrame(tick);}};
$('#replayBtn').onclick=()=>restartPlay();
$('#playAll').onchange=e=>{R.playAll=e.target.checked;};
function slideHasVideo(sl){return sl&&state.media.type==='video'&&R.video&&JSON.stringify(sl.items,(k,v)=>k==='draw'?undefined:v).includes('"media"');}
function restartPlay(){R.playing=true;$('#playBtn').textContent='Pausar';R.t0=performance.now();R.pausedAt=0;startVideoFor(R.slides[R.cur]);requestAnimationFrame(tick);}
function startVideoFor(sl){if(!R.video)return;if(slideHasVideo(sl)){try{R.video.currentTime=0;}catch(e){}R.video.play().catch(()=>{});}else R.video.pause();}
function tick(now){
  if(!R.playing||R.mode!=='anim')return;const sl=R.slides[R.cur];if(!sl)return;let t=(now-R.t0)/1000;
  if(t>sl.total){if(R.playAll&&R.slides.length>1){R.cur=(R.cur+1)%R.slides.length;updateNav();}R.t0=now;t=0;startVideoFor(R.slides[R.cur]);}
  R.pausedAt=t;drawSlide(pctx,R.slides[R.cur],t);requestAnimationFrame(tick);
}
function syncVideoStatic(){const v=R.video;if(!v)return;if(!v.paused)v.pause();const tt=clamp(state.media.videoTime,0,v.duration||0);if(Math.abs(v.currentTime-tt)>0.05){try{v.currentTime=tt;}catch(e){}}}

/* ---------- Utilidades de archivos ---------- */
const dlP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
function toast(msg,err=false){const t=$('#toast');t.textContent=msg;t.classList.toggle('err',!!err);t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3200);}
async function saveFile(name,data){
  const d=await dlP;
  if(d){try{await d.save({filename:name,data});toast('Archivo listo: '+name);}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Hay una descarga pendiente de confirmar. Inténtalo en unos segundos.',true);return;}toast('No se pudo guardar el archivo ('+(e&&e.code||'error')+').',true);}return;}
  const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);toast('Descargando '+name);
}
function slug(s){return String(s||'carrusel').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'carrusel';}
function baseName(){return slug(state.cover.role||state.author.name);}
function fileName(sl){return `${String(sl.index+1).padStart(2,'0')}-${slug(sl.label)}`;}
function readAsDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function readImage(file,max=2160){
  const url=await readAsDataURL(file);const im=await loadImage(url);const [w,h]=[im.naturalWidth,im.naturalHeight];const sc=Math.min(1,max/Math.max(w,h));
  if(sc===1&&file.size<1.6e6)return url;const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.9);
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.append(s);});}
async function ensurePdf(){
  if(window.pdfjsLib)return window.pdfjsLib;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base+'pdf.worker.min.js');await loadScript(base+'pdf.min.js');
  const lib=window.pdfjsLib||window['pdfjs-dist/build/pdf'];lib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';return lib;
}
async function pdfToImages(file){
  const lib=await ensurePdf();const buf=await file.arrayBuffer();const doc=await lib.getDocument({data:buf}).promise;const out=[];const n=Math.min(doc.numPages,30);
  for(let i=1;i<=n;i++){const page=await doc.getPage(i);const vp0=page.getViewport({scale:1});const vp=page.getViewport({scale:1400/vp0.width});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);await page.render({canvasContext:cx,viewport:vp}).promise;out.push(c.toDataURL('image/jpeg',0.88));}
  if(doc.numPages>30)toast('Se han importado las primeras 30 páginas.');return out;
}

function pickMime(){const c=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];if(!window.MediaRecorder)return null;return c.find(m=>MediaRecorder.isTypeSupported(m))||null;}
function videoExt(m){return m&&m.startsWith('video/mp4')?'mp4':'webm';}
function recordCanvas(c,duration,drawAt,onProgress){
  return new Promise((res,rej)=>{
    const mime=pickMime();if(!mime){rej(new Error('Este navegador no permite grabar vídeo. Prueba con Chrome o Edge.'));return;}
    const stream=c.captureStream(Number(state.anim.fps)||30);const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12e6});const chunks=[];
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());res(new Blob(chunks,{type:mime.split(';')[0]}));};rec.onerror=e=>rej(e.error||e);
    drawAt(0);rec.start(250);const t0=performance.now();
    const step=()=>{if(R.cancelRec){rec.stop();return;}const t=(performance.now()-t0)/1000;drawAt(Math.min(t,duration));onProgress(Math.min(1,t/duration));if(t>=duration+0.15){rec.stop();return;}requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
function openRec(text){R.cancelRec=false;$('#recText').textContent=text;$('#recBar').style.width='0%';$('#recModal').classList.add('open');$('#recCancel').focus();}
function closeRec(){$('#recModal').classList.remove('open');}
$('#recCancel').onclick=()=>{R.cancelRec=true;};
async function exportVideo(kind){
  const mime=pickMime();if(!mime){toast('Este navegador no permite grabar vídeo. Prueba con Chrome o Edge.',true);return;}
  const wasPlaying=R.playing;R.playing=false;const {W,H}=dims();const c=document.createElement('canvas');c.width=W;c.height=H;c.style.cssText='position:fixed;left:-99999px;top:0;width:10px;height:10px';document.body.append(c);const ctx=c.getContext('2d');
  const ext=videoExt(mime);
  try{
    if(kind==='current'||kind==='each'){
      const list=kind==='current'?[R.slides[R.cur]]:R.slides;const blobs=[];
      for(let i=0;i<list.length;i++){const sl=list[i];if(R.cancelRec)break;openRec(`Grabando ${sl.label} (${i+1} de ${list.length}). Mantén esta pestaña visible.`);startVideoFor(sl);
        const b=await recordCanvas(c,sl.total,t=>drawSlide(ctx,sl,t),p=>{$('#recBar').style.width=((i+p)/list.length*100).toFixed(1)+'%';});blobs.push([sl,b]);}
      closeRec();if(R.cancelRec){toast('Grabación cancelada.');return;}
      if(blobs.length===1)await saveFile(`${baseName()}-${fileName(blobs[0][0])}.${ext}`,blobs[0][1]);
      else{if(!window.JSZip){toast('No se pudo cargar el compresor ZIP.',true);return;}const zip=new JSZip();blobs.forEach(([sl,b])=>zip.file(`${fileName(sl)}.${ext}`,b));await saveFile(`${baseName()}-videos.zip`,await zip.generateAsync({type:'blob'}));}
    }else{
      const tr=state.anim.transition==='corte'?0:0.6;const segs=[];let acc=0;R.slides.forEach((sl,i)=>{segs.push({sl,start:acc});acc+=sl.total+(i<R.slides.length-1?tr:0);});const total=acc;
      const bufA=document.createElement('canvas'),bufB=document.createElement('canvas');[bufA,bufB].forEach(b=>{b.width=W;b.height=H;});const aCtx=bufA.getContext('2d'),bCtx=bufB.getContext('2d');let lastIdx=-1;
      openRec(`Grabando el carrusel completo (${total.toFixed(1)} s). Mantén esta pestaña visible.`);
      const blob=await recordCanvas(c,total,t=>{
        let i=segs.length-1;for(let k=0;k<segs.length;k++){if(t<segs[k].start+segs[k].sl.total+(k<segs.length-1?tr:0)){i=k;break;}}
        const s=segs[i];const lt=t-s.start;if(i!==lastIdx){lastIdx=i;startVideoFor(s.sl);}
        if(lt<=s.sl.total||i===segs.length-1){drawSlide(ctx,s.sl,Math.min(lt,s.sl.total));return;}
        const e=EASE.inOutSine(clamp((lt-s.sl.total)/tr));const nx=segs[i+1].sl;drawSlide(aCtx,s.sl,s.sl.total);drawSlide(bCtx,nx,0);ctx.clearRect(0,0,W,H);
        if(state.anim.transition==='fundido'){ctx.drawImage(bufA,0,0);ctx.globalAlpha=e;ctx.drawImage(bufB,0,0);ctx.globalAlpha=1;}
        else{ctx.drawImage(bufA,-W*e,0);ctx.drawImage(bufB,W*(1-e),0);}
      },p=>{$('#recBar').style.width=(p*100).toFixed(1)+'%';});
      closeRec();if(R.cancelRec){toast('Grabación cancelada.');return;}await saveFile(`${baseName()}-carrusel.${ext}`,blob);
    }
  }catch(e){closeRec();toast(e.message||'No se pudo grabar el vídeo.',true);}
  finally{c.remove();R.cancelRec=false;if(wasPlaying&&R.mode==='anim')restartPlay();else renderStatic();}
}
async function importFile(file){
  try{
    const txt=await file.text();let data;
    if(/\.html?$/i.test(file.name)||/^\s*</.test(txt)){const doc=new DOMParser().parseFromString(txt,'text/html');const el=doc.getElementById('carousel-state');if(!el)throw new Error('Ese HTML no contiene un carrusel exportado desde aquí.');data=JSON.parse(el.textContent);}
    else data=JSON.parse(txt);
    delete data._app;state=deepMerge(clone(DEFAULT),data);
    if(state.media.type==='video'&&!R.video)toast('Proyecto importado. Vuelve a subir el vídeo: no se guarda en el archivo.');else toast('Proyecto importado.');
    renderPanel();changed();
  }catch(e){toast(e.message&&!e.message.startsWith('Unexpected')?e.message:'El archivo no es un proyecto válido (JSON o HTML exportado).',true);}
}

let uid=0;
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
function group(title,hint,...kids){return h('section',{class:'group'},h('h3',{},title),hint?h('p',{class:'hint'},hint):null,...kids);}
function fText(label,path,{area=false,rows=3,ph=''}={}){const id='f'+(++uid);const inp=area?h('textarea',{id,rows,placeholder:ph}):h('input',{id,type:'text',placeholder:ph});inp.value=get(path)??'';inp.addEventListener('input',()=>set(path,inp.value));return h('div',{class:'field'},h('label',{for:id},label),inp);}
function fNumber(label,path,{min=0,max=1e9,step=1}={}){const id='f'+(++uid);const inp=h('input',{id,type:'number',min,max,step});inp.value=get(path);inp.addEventListener('input',()=>{const v=Number(inp.value);if(!isNaN(v))set(path,clamp(v,min,max));});return h('div',{class:'field'},h('label',{for:id},label),inp);}
function fRange(label,path,{min=0,max=100,step=1,fmt=v=>v,rebuild=false}={}){const id='f'+(++uid);const inp=h('input',{id,type:'range',min,max,step});inp.value=get(path);const out=h('output',{for:id},fmt(get(path)));inp.addEventListener('input',()=>{const v=Number(inp.value);out.textContent=fmt(v);set(path,v);});if(rebuild)inp.addEventListener('change',()=>renderPanel());return h('div',{class:'field'},h('label',{for:id},label),h('div',{class:'range'},inp,out));}
function fSelect(label,path,opts,{rebuild=false,onSet}={}){const id='f'+(++uid);const sel=h('select',{id},...Object.entries(opts).map(([v,l])=>h('option',{value:v},l)));sel.value=get(path);sel.addEventListener('change',()=>{set(path,sel.value,rebuild);onSet&&onSet(sel.value);});return h('div',{class:'field'},h('label',{for:id},label),sel);}
function fSeg(label,path,opts,{rebuild=true,onSet}={}){const cur=get(path);const seg=h('div',{class:'seg',role:'group','aria-label':label},...Object.entries(opts).map(([v,l])=>h('button',{type:'button','aria-pressed':String(v)===String(cur)?'true':'false',onclick:()=>{set(path,v,rebuild);onSet&&onSet(v);}},l)));return h('div',{class:'field'},label?h('span',{class:'lbl'},label):null,seg);}
function fToggle(label,path,{rebuild=false}={}){const inp=h('input',{type:'checkbox',role:'switch'});inp.checked=!!get(path);inp.addEventListener('change',()=>set(path,inp.checked,rebuild));return h('label',{class:'toggle'},h('span',{},label),inp);}
function fColor(label,path){const id='f'+(++uid);const c=h('input',{type:'color',id,'aria-label':label});const tx=h('input',{type:'text','aria-label':label+' en hexadecimal'});c.value=tx.value=get(path);c.addEventListener('input',()=>{tx.value=c.value;set(path,c.value);});tx.addEventListener('change',()=>{if(/^#[0-9a-f]{6}$/i.test(tx.value)){c.value=tx.value;set(path,tx.value);}else tx.value=get(path);});return h('div',{class:'field'},h('label',{for:id},label),h('div',{class:'color-row'},c,tx));}
function fFile(text,accept,multiple,onFiles,cls='btn'){const inp=h('input',{type:'file',accept,class:'sr',tabindex:'-1'});if(multiple)inp.multiple=true;inp.addEventListener('change',async()=>{const fs=[...inp.files];inp.value='';if(fs.length)await onFiles(fs);});const b=h('button',{type:'button',class:cls,onclick:()=>inp.click()},text);return h('div',{},b,inp);}

const TABS=[['post','Publicación'],['media','Multimedia'],['cover','Portada'],['cta','Cierre'],['style','Estilo'],['anim','Animación'],['export','Exportar']];

const PANELS={

    const P=state.post,A=state.author,ST=state.stats;

function thumbEditor(){
  const m=state.media;if(!m.items.length)return null;
  return h('div',{class:'thumbs-edit'},...m.items.map((src,i)=>h('figure',{},h('img',{src,alt:`Imagen ${i+1}`}),h('div',{class:'ctl'},
    h('button',{type:'button','aria-label':'Mover a la izquierda',onclick:()=>{if(!i)return;const a=[...m.items];[a[i-1],a[i]]=[a[i],a[i-1]];set('media.items',a,true);}},'‹'),
    h('button',{type:'button','aria-label':'Quitar',onclick:()=>{const a=[...m.items];a.splice(i,1);set('media.items',a,true);}},'✕'),
    h('button',{type:'button','aria-label':'Mover a la derecha',onclick:()=>{if(i>=m.items.length-1)return;const a=[...m.items];[a[i+1],a[i]]=[a[i],a[i+1]];set('media.items',a,true);}},'›')))));
}
function elRow(k,label){
  const c=state.anim.el[k]||{type:'fade',dur:0.6};const opts=Object.entries(ANIM_TYPES).filter(([t])=>{if(['typewriter','words','lines'].includes(t))return TEXTUAL.has(k);if(t==='count-up')return k==='stats';return true;});
  const sel=h('select',{'aria-label':`Animación de ${label}`},...opts.map(([v,l])=>h('option',{value:v},l)));sel.value=c.type;
  const isType=c.type==='typewriter';const rng=h('input',{type:'range',min:0.2,max:3,step:0.05,'aria-label':`Duración de ${label}`,disabled:isType||c.type==='none'});rng.value=c.dur;
  const out=h('span',{},isType?'según texto':c.dur.toFixed(2)+' s');
  sel.addEventListener('change',()=>{state.anim.el[k]={...state.anim.el[k],type:sel.value};markCustom();changed();renderPanel();});
  rng.addEventListener('input',()=>{state.anim.el[k]={...state.anim.el[k],dur:Number(rng.value)};out.textContent=Number(rng.value).toFixed(2)+' s';markCustom();changed();});
  return h('div',{class:'el-row'},h('span',{class:'name'},label),h('div',{class:'ctrls'},sel,h('div',{class:'dur'},rng,out)));
}
function markCustom(){if(state.anim.preset!=='custom'){state.anim.preset='custom';}}
function applyPreset(k){const p=PRESETS[k];Object.assign(state.anim,{preset:k,order:p.order,stagger:p.stagger,ease:p.ease,el:clone(p.el)});changed();renderPanel();if(R.mode!=='anim')setMode('anim');else restartPlay();}
async function setVideo(file){
  if(R.video){R.video.pause();URL.revokeObjectURL(R.video.src);}
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.loop=true;v.preload='auto';v.src=URL.createObjectURL(file);
  await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('No se pudo leer el vídeo.'));}).catch(e=>{toast(e.message,true);});
  v.addEventListener('seeked',()=>{if(R.mode==='static')renderStatic();scheduleThumbs();});
  R.video=v;state.media.videoTime=0;renderPanel();changed();
}
function renderFmtTop(){const el=$('#fmtTop');el.innerHTML='';Object.keys(FORMATS).forEach(f=>el.append(h('button',{type:'button','aria-pressed':state.format===f?'true':'false',onclick:()=>{set('format',f);renderFmtTop();if(tab==='style'||tab==='export')renderPanel();}},f)));}
